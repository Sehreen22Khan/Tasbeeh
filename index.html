<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tasbih</title>
<style>
body{font-family:sans-serif;background:#0f3d2e;color:#fff;text-align:center;margin:0;padding:10px}
.d{background:#1b5e45;border-radius:14px;margin:10px 0;padding:12px}
.n{font-size:26px}.c{font-size:22px;margin:6px}
button,select,input{font-size:18px;border:none;border-radius:10px;padding:12px;margin:4px}
input{width:85%}
.tap{width:100%;font-size:28px;padding:30px;background:#f2c94c}
.done{opacity:.5}
#vbtn{background:#4caf50;color:#fff;width:100%}
#vbtn.on{background:#c0392b}
#heard{min-height:24px;font-size:16px;opacity:.8}
.del{background:#7a2b2b;color:#fff}
.empty{opacity:.8;padding:20px}
</style></head><body>
<h2>Tasbih Counter</h2>
<div class="d">
 <select id="lang"><option value="ar-SA">Arabic</option><option value="en-US">English</option></select>
 <button id="vbtn" onclick="toggleVoice()">🎤 Start Voice Counting</button>
 <div id="heard"></div>
</div>
<div id="app"></div>
<div class="d">
 <div class="n">Add Dhikr</div>
 <input id="nn" placeholder="Name, e.g. SubhanAllah">
 <input id="ng" type="number" placeholder="Target, e.g. 1000">
 <input id="nk" placeholder="Voice words (optional), comma separated">
 <button onclick="addDhikr()">Add</button>
</div>
<script>
const KNOWN=[
 [/subhan/i,"subhan,سبحان"],[/hamd/i,"hamd,حمد"],[/akbar/i,"akbar,اكبر,أكبر"],
 [/staghfir/i,"staghfir,استغفر"],[/ilaha/i,"ilaha,illallah,اله,إله"],
 [/salli|salawat|durood/i,"salli,صل"],[/hawla|quwwata/i,"hawla,quwwata,حول,قوة"]];
let list=JSON.parse(localStorage.getItem("tasbih2")||"null");
if(!list){
 const old=localStorage.getItem("tasbih");
 if(old){const o=JSON.parse(old);list=[
  {name:"SubhanAllah",goal:200000,count:o[0],keys:"subhan,سبحان"},
  {name:"Alhamdulillah",goal:200000,count:o[1],keys:"hamd,حمد"},
  {name:"Allahu Akbar",goal:200000,count:o[2],keys:"akbar,اكبر,أكبر"},
  {name:"Astaghfirullah",goal:200000,count:o[3],keys:"staghfir,استغفر"}];}
 else list=[];
 save();
}
function save(){localStorage.setItem("tasbih2",JSON.stringify(list))}
function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
function pat(k){const w=k.split(",").map(x=>x.trim().toLowerCase().replace(/\s+/g,"")).filter(Boolean);
 return w.length?new RegExp(w.map(esc).join("|"),"g"):null}
function add(i,n){const d=list[i];d.count=Math.min(d.goal,d.count+n);save();draw()}
function tap(i){if(list[i].count<list[i].goal){add(i,1);if(navigator.vibrate)navigator.vibrate(15)}}
function undo(i){if(list[i].count>0){list[i].count--;save();draw()}}
function del(i){if(confirm("Delete "+list[i].name+" and its count?")){list.splice(i,1);save();draw()}}
function addDhikr(){
 const n=document.getElementById("nn").value.trim(),g=parseInt(document.getElementById("ng").value);
 let k=document.getElementById("nk").value.trim();
 if(!n||!g||g<1){alert("Please enter a name and a target");return}
 if(!k){const f=KNOWN.find(x=>x[0].test(n));k=f?f[1]:n}
 list.push({name:n,goal:g,count:0,keys:k});save();draw();
 ["nn","ng","nk"].forEach(id=>document.getElementById(id).value="");
}
function draw(){
 document.getElementById("app").innerHTML=list.length?list.map((d,i)=>`
 <div class="d ${d.count>=d.goal?'done':''}">
  <div class="n">${d.name}</div>
  <div class="c">${d.count.toLocaleString()} / ${d.goal.toLocaleString()}</div>
  <button class="tap" onclick="tap(${i})">${d.count>=d.goal?'Complete ✓':'Tap'}</button>
  <button onclick="undo(${i})">Undo</button>
  <button class="del" onclick="del(${i})">Delete</button>
 </div>`).join(""):'<div class="empty">No dhikr yet. Add one below.</div>'}

let rec,on=false,lock=null;
function heard(t){
 t=t.toLowerCase().replace(/\s+/g,"");
 let msg=[];
 list.forEach((d,i)=>{const p=pat(d.keys||"");if(!p)return;
  const m=(t.match(p)||[]).length;if(m&&d.count<d.goal){add(i,m);msg.push(d.name+" +"+m)}});
 document.getElementById("heard").textContent=msg.length?msg.join(", "):"(not recognised)";
}
async function toggleVoice(){
 const b=document.getElementById("vbtn");
 if(on){on=false;rec&&rec.stop();if(lock){lock.release();lock=null}
  b.classList.remove("on");b.textContent="🎤 Start Voice Counting";return}
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){alert("Voice recognition isn't supported here. Try opening in Safari.");return}
 rec=new SR();rec.lang=document.getElementById("lang").value;
 rec.continuous=true;rec.interimResults=false;
 rec.onresult=e=>{for(let r=e.resultIndex;r<e.results.length;r++)
  if(e.results[r].isFinal)heard(e.results[r][0].transcript)};
 rec.onend=()=>{if(on)setTimeout(()=>{try{rec.start()}catch(x){}},300)};
 rec.onerror=e=>{document.getElementById("heard").textContent="Mic: "+e.error};
 try{rec.start()}catch(x){}
 on=true;b.classList.add("on");b.textContent="⏹ Stop Voice Counting";
 try{lock=await navigator.wakeLock.request("screen")}catch(x){}
}
draw();
</script></body></html>
